---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dba-role
  namespace: dba
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dba-rb
  namespace: dba
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dba-role
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: DBA
 

---
# Let's Encrypt PRODUCTION. Only apply this after the staging Certificate
# above has reached Ready=True. Prod rate limit is 50 certs per registered
# domain per week and failures count against you.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cavj-dev-prod
  namespace: cert-manager
spec:
  secretName: cavj-dev-tls

  duration: 2160h # 90 days
  renewBefore: 720h # 30 days

  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer

  commonName: "*.cavj.dev"

  # NOTE: a wildcard is only one label deep. "*.cavj.dev" covers
  # "teleport.cavj.dev" but NOT "app.teleport.cavj.dev". If you ever serve a
  # second-level subdomain, add "*.teleport.cavj.dev" here as well.
  dnsNames:
    - "*.cavj.dev"
    - "cavj.dev"

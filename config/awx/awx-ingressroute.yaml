apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: awx-gui
  namespace: awx
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`://awx.cavj.dev`) # Make sure to change to your domain
      kind: Rule
      services:
        - name:  awx-operator-controller-manager-metrics-service        # Replace with your actual AWX web service name
          port: 8443                # Replace with your AWX service port
  tls:
    secretName: awx-tls
    namespace: traefik              # Tells Traefik to look in its own namespace for the cert


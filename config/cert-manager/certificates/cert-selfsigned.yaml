---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cavj-dev-selfsigned
  namespace: cert-manager
spec:
  secretName: cavj-dev-self-tls

  duration: 2160h # 90 days
  renewBefore: 720h # 30 days

  issuerRef:
    name: selfsigned
    kind: ClusterIssuer

  commonName: "*.cavj.dev"

  dnsNames:
    - "*.cavj.dev"
    - "cavj.dev"

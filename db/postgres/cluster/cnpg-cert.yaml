apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cnpg-server-cert
  namespace: cloudnativepg # Must match your DB namespace
spec:
  secretName: my-postgresql-server-cert # cert-manager will create this here
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  subject:
    organizations:
      - cnpg
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth
  dnsNames:
    # Replace 'cluster-name' with your intended CloudNativePG cluster name
    - cavj.dev
  issuerRef:
    name: letsencrypt-prod # Your existing ClusterIssuer name
    kind: ClusterIssuer
    group: cert-manager.io

